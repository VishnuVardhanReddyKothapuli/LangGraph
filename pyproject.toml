[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-rag"
version = "0.1.0"
description = "A small, notebook-first document chatbot with hybrid Qdrant retrieval."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langchain-qdrant>=1,<2",
  "langchain-google-genai>=4,<5",
  "langchain-groq>=1,<2",
  "qdrant-client>=1.15,<2",
  "fastembed>=0.7,<1",
  "pypdf>=6,<7",
  "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folio = ["static/*"]
